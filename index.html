<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Use Notion — Detector Inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --di-purple: #5000B3;
    --di-purple-deep: #3B0086;
    --di-orange: #FF6300;
    --di-orange-deep: #E84500;
    --di-ink: #181818;
    --di-grey-mid: #999999;
    --di-grey-light: #F4F4F4;
    --di-grey-line: #E8E8E8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: 'Roboto', Arial, sans-serif; font-size: 16px;
    color: var(--di-ink); background: #fff;
  }
  h1, h2, h3 { font-weight: 700; margin: 0; }
  p { line-height: 1.65; color: #333; }
  button { font-family: 'Roboto', Arial, sans-serif; }
  a.link-btn { color: var(--di-purple); font-size: 13.5px; cursor: pointer; text-decoration: underline; }

  #app { min-height: 100vh; display: flex; flex-direction: column; }

  #cover {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--di-purple); color: #fff; text-align: center; padding: 60px 24px;
  }
  #cover .notion-logo { font-size: 64px; margin-bottom: 20px; }
  #cover h1 { font-size: 30px; max-width: 520px; margin-bottom: 16px; }
  #cover p { color: rgba(255,255,255,0.8); font-size: 15px; max-width: 440px; margin: 0 auto 36px; }

  #menu { flex: 1; display: none; flex-direction: column; }
  .menu-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 40px 0;
  }
  .menu-header .brand { font-size: 15px; font-weight: 700; color: var(--di-purple); letter-spacing: .02em; }
  .menu-wrap { flex: 1; max-width: 680px; margin: 0 auto; padding: 30px 40px 40px; width: 100%; }
  .menu-wrap h2 { font-size: 26px; margin-bottom: 4px; }
  .menu-sub { color: #666; font-size: 14px; margin-bottom: 24px; }
  .lesson-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 4px; border-top: 1px solid var(--di-grey-line); cursor: pointer;
  }
  .lesson-row:last-child { border-bottom: 1px solid var(--di-grey-line); }
  .lesson-row:hover .lesson-title { color: var(--di-purple); }
  .lesson-row-left { display: flex; align-items: center; gap: 16px; }
  .lesson-num {
    width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0; border: 1.5px solid var(--di-grey-line); color: var(--di-grey-mid);
  }
  .lesson-num.done { background: #1E8E3E; border-color: #1E8E3E; color: #fff; }
  .lesson-title { font-size: 15.5px; font-weight: 500; }
  .lesson-status { font-size: 12.5px; color: var(--di-grey-mid); margin-top: 2px; }
  .lesson-status.done { color: #1E8E3E; }
  .chevron { color: var(--di-grey-mid); font-size: 18px; }

  .progress-track { height: 3px; background: var(--di-grey-line); }
  .progress-fill { height: 100%; background: var(--di-orange); transition: width .25s ease; }

  .chrome-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px 0; }
  .chrome-header .brand { font-size: 14px; font-weight: 700; color: var(--di-purple); }
  .step-label { font-size: 12px; color: var(--di-grey-mid); font-weight: 500; letter-spacing: .02em; }
  .chrome-footer { display: flex; align-items: center; justify-content: space-between; padding: 18px 40px; margin-top: auto; }
  .chrome-footer .brand-small { font-size: 11px; color: var(--di-grey-mid); font-weight: 700; letter-spacing: .04em; }
  .chrome-footer .date-stamp { font-size: 11.5px; color: var(--di-grey-mid); }

  #wizard { flex: 1; display: none; flex-direction: column; }
  .content-wrap { flex: 1; max-width: 640px; margin: 0 auto; padding: 44px 40px 20px; width: 100%; }
  .tag { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--di-orange-deep); margin-bottom: 12px; display: block; }
  .content-wrap h2 { font-size: 26px; margin-bottom: 4px; }
  .rule { width: 40px; height: 3px; background: var(--di-orange); margin: 14px 0 22px; border: none; }
  .lede { font-size: 16px; color: #444; margin-bottom: 8px; }

  .outline-list { margin-top: 26px; }
  .outline-item { display: flex; align-items: baseline; gap: 16px; padding: 16px 0; border-top: 1px solid var(--di-grey-line); }
  .outline-item:last-child { border-bottom: 1px solid var(--di-grey-line); }
  .outline-num { font-size: 13px; color: var(--di-grey-mid); font-weight: 700; min-width: 20px; }
  .outline-name { font-size: 16px; font-weight: 500; }

  .detail-section { margin-top: 28px; }
  .detail-label { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--di-grey-mid); margin-bottom: 8px; }
  .detail-example { font-size: 14.5px; color: #333; background: var(--di-grey-light); padding: 14px 16px; border-radius: 8px; font-style: italic; }
  .pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 6px; }
  @media (max-width: 560px) { .pros-cons { grid-template-columns: 1fr; gap: 18px; } }
  .pros-cons ul { margin: 0; padding-left: 18px; font-size: 14.5px; color: #333; }
  .pros-cons li { margin-bottom: 6px; }
  .pc-heading { font-size: 12.5px; font-weight: 700; margin-bottom: 8px; }
  .pc-heading.pro { color: #1E8E3E; }
  .pc-heading.con { color: var(--di-orange-deep); }
  .differentiation-text { font-size: 14.5px; color: #333; }

  table.compare-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13.5px; }
  table.compare-table th { text-align: left; padding: 8px 14px 8px 0; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--di-grey-mid); border-bottom: 2px solid var(--di-ink); }
  table.compare-table td { padding: 16px 14px 16px 0; border-bottom: 1px solid var(--di-grey-line); vertical-align: top; }
  table.compare-table td:first-child { color: #666; }

  .why-block { font-size: 16.5px; line-height: 1.7; color: #222; }
  .why-block strong { color: var(--di-purple); }

  .nav-row { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px 8px; max-width: 640px; margin: 0 auto; width: 100%; gap: 12px; }
  .btn-text { background: none; border: none; color: var(--di-grey-mid); font-size: 14px; font-weight: 500; cursor: pointer; padding: 10px 4px; }
  .btn-text:hover { color: var(--di-ink); }
  .btn-text:disabled { visibility: hidden; }
  .btn-solid { background: var(--di-orange); color: #fff; border: none; font-weight: 700; font-size: 14.5px; padding: 12px 26px; border-radius: 10px; cursor: pointer; transition: background .15s; }
  .btn-solid:hover { background: var(--di-orange-deep); }
  .btn-solid:disabled { background: #D9D9D9; color: #999; cursor: not-allowed; }
  .btn-outline { background: none; border: 1.5px solid var(--di-ink); color: var(--di-ink); font-weight: 700; font-size: 14.5px; padding: 11px 24px; border-radius: 10px; cursor: pointer; }
  .btn-outline:hover { background: var(--di-ink); color: #fff; }

  .quiz-question .q-title { font-weight: 500; font-size: 17px; margin-bottom: 18px; line-height: 1.5; }
  .option { display: flex; align-items: center; gap: 12px; padding: 14px 4px; border-bottom: 1px solid var(--di-grey-line); cursor: pointer; font-size: 14.5px; }
  .option:first-of-type { border-top: 1px solid var(--di-grey-line); }
  .option .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #BBB; flex-shrink: 0; position: relative; }
  .option.selected .dot { border-color: var(--di-purple); }
  .option.selected .dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--di-purple); }
  .option.selected { color: var(--di-purple); font-weight: 500; }

  .review-answer-item { padding: 18px 0; border-top: 1px solid var(--di-grey-line); }
  .review-answer-item:last-child { border-bottom: 1px solid var(--di-grey-line); }
  .review-answer-q { font-size: 14.5px; font-weight: 500; margin-bottom: 6px; }
  .review-answer-a { font-size: 14px; color: var(--di-purple); }
  .review-answer-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }

  .score-ring-wrap { position: relative; width: 160px; height: 160px; margin: 0 auto 24px; }
  .score-ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .ring-track { fill: none; stroke: var(--di-grey-line); stroke-width: 10; }
  .ring-fill { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.7s cubic-bezier(.4,0,.2,1), stroke 0.3s ease; }
  .ring-fill.pass { stroke: #1E8E3E; }
  .ring-fill.fail { stroke: var(--di-orange-deep); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-score { font-size: 34px; font-weight: 700; line-height: 1; }
  .ring-score.pass { color: #1E8E3E; }
  .ring-score.fail { color: var(--di-orange-deep); }
  .ring-label { font-size: 12px; color: var(--di-grey-mid); margin-top: 5px; }

  #step-results .content-wrap { text-align: center; }
  .review-list { text-align: left; margin-top: 30px; }
  .review-item { display: flex; gap: 10px; padding: 12px 0; border-top: 1px solid var(--di-grey-line); font-size: 13.5px; }
  .review-item .mark { font-weight: 700; flex-shrink: 0; }
  .review-item.right .mark { color: #1E8E3E; }
  .review-item.wrong .mark { color: var(--di-orange-deep); }
  .review-item em { color: #666; font-style: normal; }

  #step-complete .content-wrap { text-align: center; }
  .nav-row.centered-actions { justify-content: center; }

  .tip-box { background: #F0EAF8; border-left: 3px solid var(--di-purple); padding: 12px 16px; border-radius: 0 8px 8px 0; margin-top: 18px; font-size: 14px; color: #333; line-height: 1.6; }
  .tip-box strong { color: var(--di-purple); }
  .notion-steps { margin: 18px 0 0; padding: 0; list-style: none; counter-reset: notion-step; }
  .notion-steps li { counter-increment: notion-step; display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--di-grey-line); font-size: 14.5px; color: #333; align-items: flex-start; }
  .notion-steps li:last-child { border-bottom: 1px solid var(--di-grey-line); }
  .notion-steps li::before { content: counter(notion-step); background: var(--di-purple); color: #fff; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }

  .illustration-wrap { margin: 24px 0 4px; border: 1px solid var(--di-grey-line); border-radius: 10px; overflow: hidden; background: #fafafa; }
  .illustration-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--di-grey-mid); padding: 8px 14px 6px; border-bottom: 1px solid var(--di-grey-line); background: #fff; }
  .illustration-wrap svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div id="app">
  <div id="cover"></div>

  <div id="menu">
    <div class="menu-header"><span class="brand">Detector Inspector &nbsp;·&nbsp; Notion Training</span></div>
    <div class="menu-wrap">
      <h2>How to Use Notion</h2>
      <div class="menu-sub">8 lessons. Pick one to start or continue.</div>
      <div id="lessonList"></div>
    </div>
  </div>

  <div id="wizard">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="chrome-header">
      <span class="brand">Detector Inspector &nbsp;·&nbsp; Notion Training</span>
      <span class="step-label" id="stepLabel"></span>
    </div>
    <div class="content-wrap" id="contentWrap"></div>
    <div class="nav-row" id="navRow"></div>
    <div class="chrome-footer">
      <span class="brand-small">DETECTOR INSPECTOR</span>
      <span class="date-stamp" id="dateStamp"></span>
    </div>
  </div>
</div>

<script>
var LESSONS = [
  {
    id: 1,
    title: "Getting Started with Notion",
    blurb: "Notion is an all-in-one workspace where your team manages tasks, projects, meeting notes, and documents. This lesson covers what Notion is, how to log in, and how to find your way around.",
    sections: [
      {
        name: "What is Notion?",
        definition: "Notion is a connected workspace that combines notes, databases, tasks, and wikis into one platform — replacing the need to switch between multiple tools.",
        example: "Instead of using one app for tasks, another for notes, and another for documents, Notion holds all of these in one place your whole team can access.",
        pros: ["Everything is connected — a task can link to a project, which links to its meeting notes", "Works on desktop, mobile, and browser — no install required to get started"],
        cons: ["Takes a short adjustment period if you're used to simpler tools", "Has more features than most people use on day one"],
        differentiation: "Notion is a <strong>workspace</strong>, not just a task manager or note-taking app — it combines both, plus databases, wiki-style pages, and more."
      },
      {
        name: "Logging In",
        definition: "You access Notion through your Detector Inspector work email. Your account has already been set up — you just need to log in for the first time.",
        example: "Go to notion.so, click 'Log in', enter your @detectorinspector.com.au email address, and follow the link sent to your inbox.",
        pros: ["No password to remember — Notion sends a magic link to your email each time", "You can stay logged in on your own device indefinitely"],
        cons: ["If you lose access to your work email, contact your Notion admin to regain access"],
        differentiation: "Your Notion account is tied to your <strong>work email</strong>, not a personal account — keep this separate from any personal Notion workspace you may have."
      },
      {
        name: "The Sidebar",
        definition: "The left sidebar is your main navigation. It shows your teamspaces, pages, and private pages. Everything you need to access is reachable from here.",
        example: "You'll see 'Detector Inspector' as your main teamspace, with pages like the Homepage, Operations Updates, and your department's section listed underneath.",
        pros: ["Pinned pages appear at the top for fast access", "You can collapse sections you don't use often"],
        cons: ["The sidebar can look crowded at first — focus on your department's section and the Homepage"],
        differentiation: "The sidebar shows <strong>shared pages</strong> (visible to your team) and <strong>Private</strong> pages (only visible to you) — they're clearly separated."
      },
      {
        name: "The Homepage",
        definition: "The Homepage is your personal dashboard inside the Detector Inspector workspace. It has Quick Links to the most common actions and shows your tasks and upcoming items.",
        example: "From the Homepage you can click 'Create Task', 'Start Meeting Notes', or navigate directly to your department's section — without searching.",
        pros: ["Saves time on the most common daily actions", "Designed specifically for how Detector Inspector uses Notion"],
        cons: ["The Homepage is shared — avoid editing the layout unless instructed"],
        differentiation: "The Homepage is a <strong>curated starting point</strong>, not a blank page — it's set up to help you do your most common tasks in one click."
      }
    ],
    examples: [
      { weak: "Opening Notion and not knowing where to look", strong: "Going straight to the Homepage → using Quick Links for the action you need → your department section for everything else" },
      { weak: "Trying to remember the URL for every page", strong: "Bookmarking the Homepage or pinning it in the sidebar — everything else links from there" }
    ],
    why: "The first few minutes in a new tool shape whether you feel confident or lost. Knowing what Notion <em>is</em>, where to log in, and where to start removes that uncertainty so you can focus on the actual work.<br><br><strong>Everything else in this course builds from this foundation.</strong>",
    questions: [
      { q: "What kind of tool is Notion?", options: ["An email client", "A connected workspace combining notes, databases, tasks, and wikis", "A spreadsheet program", "A video conferencing tool"], correct: 1 },
      { q: "How do you log in to Notion at Detector Inspector?", options: ["Username and password set by IT", "Via your @detectorinspector.com.au work email — a magic link is sent to your inbox", "Through Microsoft Teams", "Using a PIN code"], correct: 1 },
      { q: "Where is the main navigation in Notion?", options: ["Top menu bar", "The left sidebar", "A floating toolbar", "The bottom taskbar"], correct: 1 },
      { q: "What is the Homepage?", options: ["The Notion website homepage", "A personal dashboard with Quick Links and your team's key pages", "A blank page you customise yourself", "The admin settings page"], correct: 1 }
    ]
  },
  {
    id: 2,
    title: "Pages and Databases",
    blurb: "Almost everything in Notion is a page. Databases are a special kind of page that holds structured rows of information — like a spreadsheet with superpowers. Understanding the difference unlocks how the whole system works.",
    sections: [
      {
        name: "Pages",
        definition: "A page is the basic unit of Notion. It can hold text, images, checklists, embeds, and sub-pages — or it can be a row inside a database.",
        example: "A meeting note is a page. A task is a page. A department wiki is a page. Each one can contain whatever content you add to it.",
        pros: ["Flexible — a page can hold almost any kind of content", "Pages can be nested inside each other for structure"],
        cons: ["Too many nested pages without a clear structure can make things hard to find"],
        differentiation: "A page is the <strong>canvas</strong>; a database is a <strong>collection of pages</strong> with shared properties added on top."
      },
      {
        name: "Databases",
        definition: "A database is a collection of pages where every entry (row) shares the same set of properties — like Status, Owner, Due Date, or Department.",
        example: "The Tasks database holds every task in the team. Each task is a page with properties like Status, Priority, Owner, and Due Date attached to it.",
        pros: ["Filter, sort, and group entries without changing the underlying data", "One database can be displayed as a table, board, calendar, or gallery"],
        cons: ["Properties need to be set up in advance — add the right ones when creating a database"],
        differentiation: "A database is <strong>structured data</strong>; a plain page is <strong>free-form content</strong>. Most databases at Detector Inspector are already built — you add rows, not the database itself."
      },
      {
        name: "Views",
        definition: "A view is a way of displaying a database. The same data can be shown as a table (spreadsheet-style), a board (Kanban columns), a calendar, or a gallery — you choose the view that helps you most.",
        example: "The Tasks database is shown as a table by default. Switch to board view to see tasks grouped by Status. Neither changes the underlying tasks — just how you see them.",
        pros: ["Different views for different workflows — no duplication needed", "Personal views don't affect how others see the same database"],
        cons: ["It can look like different views contain different data — they don't, they're the same"],
        differentiation: "Views are about <strong>display</strong>, not data. Changing a view never changes the underlying entries."
      }
    ],
    examples: [
      { weak: "Creating a new blank page for every task", strong: "Adding a new row to the Tasks database — so the task inherits Status, Owner, and Due Date properties automatically" },
      { weak: "Hunting through pages to find a task", strong: "Filtering the Tasks database by Owner = You, Status = In Progress — instant results" }
    ],
    why: "Once you understand that a task, a meeting note, and a project are all pages — just with different properties — Notion stops feeling like many separate things and starts feeling like one connected system.<br><br><strong>Pages + databases is the skeleton everything else hangs on.</strong>",
    questions: [
      { q: "What is a Notion page?", options: ["Only a text document", "The basic unit of Notion — can hold any content, including being a row in a database", "A spreadsheet row only", "A view of a database"], correct: 1 },
      { q: "What makes a database different from a plain page?", options: ["It can only hold numbers", "It's a collection of pages with shared, structured properties on every entry", "It can't be shared with others", "It requires a paid plan"], correct: 1 },
      { q: "What is a 'view' in Notion?", options: ["A different version of the data", "A way of displaying the same database — table, board, calendar, gallery", "A private copy of a database", "A link to another page"], correct: 1 },
      { q: "If you switch a database from table to board view, what happens to the data?", options: ["Entries are deleted from the table", "Nothing — it's the same data, just displayed differently", "A duplicate is created", "The properties are reset"], correct: 1 }
    ]
  },
  {
    id: 3,
    title: "Creating and Managing Tasks",
    blurb: "Tasks are how individual work items are tracked in Notion. This lesson covers how to create a task, fill in its properties, keep it up to date, and understand the difference between a Task and a Project.",
    sections: [
      {
        name: "Creating a Task",
        definition: "A task is created by clicking the Quick Link button on the Homepage, or by clicking 'New' inside the Tasks database. Every new task uses a standard template with the right properties already set up.",
        example: "Click 'Create Task' on the Homepage → a new page opens with the [Create Task] template → fill in the name, status, owner, and due date → close the page → it appears in the Tasks database.",
        pros: ["The template ensures every task has the same properties — no missing fields", "Takes under 30 seconds once you know the flow"],
        cons: ["Avoid creating tasks as plain pages outside the database — they won't have the right properties"],
        differentiation: "Always create tasks <strong>through the database or the Quick Link</strong>, not as standalone blank pages."
      },
      {
        name: "Task Properties",
        definition: "Every task has a set of properties that give it context: Status, Owner, Priority, Department, Due Date, and a link to the Project it belongs to.",
        example: "A task called 'Update onboarding guide' would have: Status = In Progress, Owner = your name, Priority = Medium, Department = Scheduling, Due Date = next Friday.",
        pros: ["Properties let anyone filter or find tasks without reading every entry", "Status drives the board view — move a task to 'Done' and it moves column automatically"],
        cons: ["Leaving properties blank makes tasks invisible in filtered views — fill them in"],
        differentiation: "The <strong>Name</strong> is what the task is; the <strong>properties</strong> are everything about how, when, who, and why."
      },
      {
        name: "Task vs. Project",
        definition: "A Task is a single, completable action. A Project is a collection of related tasks with a broader goal, a timeline, and a defined outcome. A task belongs to a project; a project is made up of tasks.",
        example: "Project: 'Revamp onboarding process'. Tasks inside it: 'Update induction guide', 'Record training video', 'Review with HR'.",
        pros: ["The distinction keeps the Tasks database from being cluttered with high-level goals", "Projects give Tasks context — you can see all tasks for one project in one click"],
        cons: ["When in doubt: if it takes more than one step to complete, it's probably a project"],
        differentiation: "Rule of thumb: a <strong>task</strong> is done when one person completes one thing. A <strong>project</strong> is done when a series of tasks across possibly multiple people are all complete."
      },
      {
        name: "Keeping Tasks Up to Date",
        definition: "A task only helps the team if its status is current. Update the status whenever you start, pause, or finish a piece of work — don't wait until a task is fully done.",
        example: "When you start working on a task: change Status from 'Not Started' to 'In Progress'. When you finish: change it to 'Done'. If blocked: 'On Hold'.",
        pros: ["Your manager and teammates can see progress without asking", "The board view gives the whole team a live picture of what's happening"],
        cons: ["Stale tasks (left on 'Not Started' for weeks) reduce trust in the system"],
        differentiation: "Status is a <strong>live signal</strong>, not a final record — update it as work progresses, not just when it's complete."
      }
    ],
    examples: [
      { weak: "Creating a blank page titled 'Update guide'", strong: "Clicking 'Create Task' on the Homepage → filling in all properties → task is searchable, filterable, and linked to a project" },
      { weak: "Leaving a task on 'Not Started' while actively working on it", strong: "Updating to 'In Progress' when you begin — gives the team an accurate picture" }
    ],

var PASS_FRACTION = 0.75;
var STEPS = [];
var current = 0;
var activeLesson = null;
var quizAnswers = [];
var lastScore = null;

function loadProgress() {
  try { return JSON.parse(localStorage.getItem("notion-lms-progress") || "{}"); } catch(e) { return {}; }
}
function saveProgress(lessonId, correctCount, total) {
  try {
    var prog = loadProgress();
    var prev = prog[lessonId] || { best: 0, total: total };
    prog[lessonId] = { best: Math.max(prev.best, correctCount), total: total };
    localStorage.setItem("notion-lms-progress", JSON.stringify(prog));
  } catch(e) {}
}

function showCover() {
  document.getElementById("cover").innerHTML =
    '<div class="notion-logo">\uD83D\uDCD3</div>' +
    '<h1>How to Use Notion</h1>' +
    '<p>A practical training course for Detector Inspector team members. Learn at your own pace &mdash; pick up where you left off any time.</p>' +
    '<button class="btn-solid" onclick="showMenu()">View lessons</button>';
  document.getElementById("cover").style.display = "flex";
  document.getElementById("menu").style.display = "none";
  document.getElementById("wizard").style.display = "none";
}

function showMenu() {
  document.getElementById("cover").style.display = "none";
  document.getElementById("wizard").style.display = "none";
  var menu = document.getElementById("menu");
  menu.style.display = "flex";
  var progress = loadProgress();
  var list = document.getElementById("lessonList");
  list.innerHTML = LESSONS.map(function(lesson) {
    var p = progress[lesson.id];
    var passed = p && (p.best / p.total) >= PASS_FRACTION;
    var status = !p ? "Not started" : (passed ? "Completed \u2014 " + p.best + "/" + p.total : "Best score " + p.best + "/" + p.total + " \u2014 not yet passed");
    return '<div class="lesson-row" data-lesson-id="' + lesson.id + '">' +
      '<div class="lesson-row-left">' +
      '<div class="lesson-num' + (passed ? " done" : "") + '">' + (passed ? "\u2713" : String(lesson.id).padStart(2, "0")) + '</div>' +
      '<div><div class="lesson-title">' + lesson.title + '</div><div class="lesson-status' + (passed ? " done" : "") + '">' + status + '</div></div>' +
      '</div><div class="chevron">\u203a</div></div>';
  }).join("");
  list.querySelectorAll(".lesson-row").forEach(function(row) {
    row.addEventListener("click", function() {
      startLesson(parseInt(row.getAttribute("data-lesson-id"), 10));
    });
  });
}

function stepIndexOf(type, extra) {
  for (var i = 0; i < STEPS.length; i++) {
    if (STEPS[i].type === type && (extra === undefined || STEPS[i].qIndex === extra)) return i;
  }
  return 0;
}

function startLesson(lessonId) {
  activeLesson = LESSONS.find(function(l) { return l.id === lessonId; });
  quizAnswers = new Array(activeLesson.questions.length).fill(null);
  lastScore = null;
  STEPS = [];
  STEPS.push({ type: "overview" });
  activeLesson.sections.forEach(function(s, i) { STEPS.push({ type: "detail", index: i }); });
  STEPS.push({ type: "example" });
  STEPS.push({ type: "why" });
  activeLesson.questions.forEach(function(q, qi) { STEPS.push({ type: "question", qIndex: qi }); });
  STEPS.push({ type: "quiz-review" });
  STEPS.push({ type: "results" });
  STEPS.push({ type: "complete" });
  current = 0;
  document.getElementById("menu").style.display = "none";
  document.getElementById("wizard").style.display = "flex";
  renderStep();
}

function goNext() { if (current < STEPS.length - 1) { current++; renderStep(); } }
function goBack() { if (current > 0) { current--; renderStep(); } }
function jumpTo(idx) { current = idx; renderStep(); }

  <rect x="290" y="34" width="254" height="150" rx="7" fill="#fff" stroke="#C8E6C9" stroke-width="1.5"/>
  <rect x="290" y="34" width="254" height="28" rx="7" fill="#E8F5E9"/>
  <text x="417" y="52" text-anchor="middle" fill="#1B5E20" font-size="9" font-weight="700">✓  Findable in 6 months</text>
  <text x="302" y="80" fill="#333" font-size="8.5">📄  Induction Guide — updated Jun 2026</text>
  <text x="302" y="96" fill="#333" font-size="8.5">📄  Q3 Performance Report — draft</text>
  <text x="302" y="112" fill="#333" font-size="8.5">📄  Team Sync Notes — 10 Jun 2026</text>
  <text x="302" y="128" fill="#333" font-size="8.5">📄  Customer FAQ — for new website</text>
  <text x="302" y="144" fill="#333" font-size="8.5">📄  Scheduling Template — v2 Jul 2026</text>
  <text x="302" y="170" fill="#1B5E20" font-size="8">What it is  +  when/version  =  always findable</text>
</svg>`
};

function getIllustration(lessonId, sectionIndex) {
  var key = lessonId + "-" + sectionIndex;
  var il = ILLUSTRATIONS[key];
  if (!il) return "";
  return '<div class="illustration-wrap"><div class="illustration-label">' + il.label + '</div>' + il.svg + '</div>';
}
// ─────────────────────────────────────────────────────────────────────────────

function renderStep() {
  var step = STEPS[current];
  var wrap = document.getElementById("contentWrap");
  var nav = document.getElementById("navRow");
  var label = document.getElementById("stepLabel");
  var progressFill = document.getElementById("progressFill");
  var L = activeLesson;

  var pct = Math.round(((current + 1) / STEPS.length) * 100);
  progressFill.style.width = pct + "%";
  label.textContent = "Lesson " + String(L.id).padStart(2, "0") + " \u00b7 Step " + (current + 1) + " of " + STEPS.length;

  var backDisabled = current === 0;
  var html = "";
  var showDefaultNav = true;

  if (step.type === "overview") {
    html = '<span class="tag">Lesson ' + String(L.id).padStart(2, "0") + '</span>' +
      '<h2>' + L.title + '</h2><hr class="rule">' +
      '<p class="lede">' + L.blurb + '</p>' +
      (L.sections.length > 1 ? '<div class="outline-list">' + L.sections.map(function(s, i) {
        return '<div class="outline-item"><span class="outline-num">0' + (i + 1) + '</span><span class="outline-name">' + s.name + '</span></div>';
      }).join("") + '</div><p class="lede" style="margin-top:22px; font-size:14.5px; color:#666;">We\u2019ll go through each one in turn.</p>' : '');
  } else if (step.type === "detail") {
    var el = L.sections[step.index];
    html = '<span class="tag">' + (L.sections.length > 1 ? ("Part " + (step.index + 1) + " of " + L.sections.length) : "Key idea") + '</span>' +
      '<h2>' + el.name + '</h2><hr class="rule">' +
      '<p class="lede">' + el.definition + '</p>' +
      '<div class="detail-section"><div class="detail-label">Example</div><div class="detail-example">' + el.example + '</div></div>' +
      '<div class="detail-section pros-cons">' +
      '<div><div class="pc-heading pro">Why it helps</div><ul>' + el.pros.map(function(p) { return "<li>" + p + "</li>"; }).join("") + '</ul></div>' +
      '<div><div class="pc-heading con">Watch out for</div><ul>' + el.cons.map(function(c) { return "<li>" + c + "</li>"; }).join("") + '</ul></div>' +
      '</div>' +
      '<div class="detail-section"><div class="detail-label">How it fits in</div><div class="differentiation-text">' + el.differentiation + '</div></div>' +
      getIllustration(L.id, step.index);
  } else if (step.type === "example") {
    html = '<span class="tag">Putting it together</span>' +
      '<h2>Common patterns &mdash; before &amp; after</h2><hr class="rule">' +
      '<p class="lede">Real situations from this lesson.</p>' +
      '<table class="compare-table"><tr><th>Common mistake</th><th>Better approach</th></tr>' +
      L.examples.map(function(ex) { return '<tr><td>' + ex.weak + '</td><td>' + ex.strong + '</td></tr>'; }).join("") +
      '</table>';
  } else if (step.type === "why") {
    showDefaultNav = false;
    html = '<span class="tag">Why it matters</span>' +
      '<h2>Wrapping up this lesson</h2><hr class="rule">' +
      '<div class="why-block"><p>' + L.why + '</p></div>' +
      '<div class="nav-row" style="padding:28px 0 0;">' +
      '<button class="btn-text" onclick="goBack()">Back</button>' +
      '<button class="btn-solid" onclick="jumpTo(stepIndexOf(\'question\', 0))">Lesson complete \u2014 start the check</button></div>';
  } else if (step.type === "question") {
    showDefaultNav = false;
    var qi = step.qIndex;
    var item = L.questions[qi];
    var isLast = qi === L.questions.length - 1;
    html = '<span class="tag">Quick check &middot; Question ' + (qi + 1) + ' of ' + L.questions.length + '</span>' +
      '<div class="quiz-question"><div class="q-title">' + item.q + '</div>' +
      item.options.map(function(opt, oi) {
        var isSelected = quizAnswers[qi] === oi;
        return '<label class="option' + (isSelected ? " selected" : "") + '" data-oi="' + oi + '">' +
          '<span class="dot"></span><span>' + opt + '</span></label>';
      }).join("") + '</div>' +
      '<div class="nav-row" style="padding:24px 0 0;">' +
      '<button class="btn-text" onclick="goBack()">Back</button>' +
      '<button class="btn-solid" id="questionNextBtn" onclick="' + (isLast ? "jumpTo(stepIndexOf('quiz-review'))" : "goNext()") + '" disabled>' +
      (isLast ? "Review answers" : "Next") + '</button></div>';
  } else if (step.type === "quiz-review") {
    showDefaultNav = false;
    html = '<span class="tag">Before you submit</span>' +
      '<h2>Review your answers</h2><hr class="rule">' +
      '<p class="lede" style="margin-bottom:6px;">Check each one \u2014 tap \u201cChange\u201d to update an answer.</p>' +
      L.questions.map(function(item, qi) {
        var picked = quizAnswers[qi] !== null ? item.options[quizAnswers[qi]] : "\u2014 not answered \u2014";
        return '<div class="review-answer-item"><div class="review-answer-row">' +
          '<div><div class="review-answer-q">' + (qi + 1) + '. ' + item.q + '</div>' +
          '<div class="review-answer-a">' + picked + '</div></div>' +
          '<a class="link-btn" onclick="jumpTo(stepIndexOf(\'question\', ' + qi + '))">Change</a></div></div>';
      }).join("") +
      '<div class="nav-row" style="padding:24px 0 0;">' +
      '<button class="btn-text" onclick="jumpTo(stepIndexOf(\'question\', ' + (L.questions.length - 1) + '))">Back</button>' +
      '<button class="btn-solid" onclick="submitQuiz()">Submit answers</button></div>';
  } else if (step.type === "results") {
    showDefaultNav = false;
    var total = L.questions.length;
    var correctCount = lastScore === null ? 0 : lastScore;
    var fraction = correctCount / total;
    var passed = fraction >= PASS_FRACTION;
    html = '<div class="score-ring-wrap"><svg viewBox="0 0 160 160"><circle class="ring-track" cx="80" cy="80" r="70"></circle>' +
      '<circle class="ring-fill ' + (passed ? "pass" : "fail") + '" id="ringFill" cx="80" cy="80" r="70"></circle></svg>' +
      '<div class="ring-center"><div class="ring-score ' + (passed ? "pass" : "fail") + '">' + correctCount + '/' + total + '</div>' +
      '<div class="ring-label">correct</div></div></div>' +
      '<h2 style="font-size:19px;">' + (passed ? "You\u2019ve got this lesson." : "Worth another pass through this lesson.") + '</h2>' +
      '<p style="max-width:420px; margin:10px auto 0; color:#555; font-size:14.5px;">' +
      "You scored " + correctCount + " out of " + total + " (" + Math.round(fraction * 100) + "%), " +
      (passed ? "above" : "below") + " the 75% pass mark" + (passed ? "." : " needed to move on.") + '</p>' +
      '<div class="review-list" id="reviewList"></div>' +
      '<div class="nav-row" style="padding:24px 0 0;">' +
      '<button class="btn-outline" onclick="jumpTo(0)">Review lesson again</button>' +
      (passed ? '<button class="btn-solid" onclick="goNext()">Finish lesson</button>' : '<button class="btn-solid" onclick="retakeQuiz()">Retake quiz</button>') +
      '</div>';
  } else if (step.type === "complete") {
    showDefaultNav = false;
    html = '<span class="tag">Nice work</span>' +
      '<h2>You\u2019ve completed Lesson ' + String(L.id).padStart(2, "0") + '</h2><hr class="rule">' +
      '<p class="lede">' + L.title + ' \u2014 done.</p>' +
      '<div class="nav-row centered-actions" style="padding:24px 0 0;">' +
      '<button class="btn-outline" onclick="retakeQuiz()">Retake quiz</button>' +
      '<button class="btn-solid" onclick="showMenu()">Back to all lessons</button></div>';
  }

  wrap.innerHTML = html;
  if (showDefaultNav) {
    nav.style.display = "flex";
    nav.innerHTML = '<button class="btn-text" onclick="goBack()" ' + (backDisabled ? "disabled" : "") + '>Back</button>' +
      '<button class="btn-solid" onclick="goNext()">Next</button>';
  } else {
    nav.style.display = "none";
    nav.innerHTML = "";
  }
  if (step.type === "question") { wireQuestionOptions(step.qIndex); }
  if (step.type === "results") { renderReview(); drawScoreRing(); }
}

function wireQuestionOptions(qi) {
  var wrap = document.getElementById("contentWrap");
  wrap.querySelectorAll(".option").forEach(function(label) {
    label.addEventListener("click", function() {
      quizAnswers[qi] = parseInt(label.getAttribute("data-oi"), 10);
      renderStep();
    });
  });
  var nextBtn = document.getElementById("questionNextBtn");
  if (nextBtn) nextBtn.disabled = quizAnswers[qi] === null;
}

function submitQuiz() {
  var correctCount = 0;
  activeLesson.questions.forEach(function(item, qi) { if (quizAnswers[qi] === item.correct) correctCount++; });
  lastScore = correctCount;
  saveProgress(activeLesson.id, correctCount, activeLesson.questions.length);
  jumpTo(stepIndexOf("results"));
}

function renderReview() {
  var reviewList = document.getElementById("reviewList");
  if (!reviewList) return;
  reviewList.innerHTML = activeLesson.questions.map(function(item, qi) {
    var isRight = quizAnswers[qi] === item.correct;
    return '<div class="review-item ' + (isRight ? "right" : "wrong") + '">' +
      '<span class="mark">' + (isRight ? "\u2713" : "\u2717") + '</span>' +
      '<span>Q' + (qi + 1) + ': ' + item.q + '<br><em>Correct answer: ' + item.options[item.correct] + '</em></span></div>';
  }).join("");
}

function drawScoreRing() {
  var circle = document.getElementById("ringFill");
  if (!circle) return;
  var total = activeLesson.questions.length;
  var correctCount = lastScore === null ? 0 : lastScore;
  var fraction = total > 0 ? correctCount / total : 0;
  var r = 70;
  var circumference = 2 * Math.PI * r;
  circle.style.transition = "none";
  circle.setAttribute("stroke-dasharray", circumference);
  circle.setAttribute("stroke-dashoffset", circumference);
  circle.getBoundingClientRect();
  requestAnimationFrame(function() {
    circle.style.transition = "";
    circle.setAttribute("stroke-dashoffset", circumference * (1 - fraction));
  });
}

function retakeQuiz() {
  quizAnswers = new Array(activeLesson.questions.length).fill(null);
  lastScore = null;
  jumpTo(stepIndexOf("question", 0));
}

function setDate() {
  var d = new Date();
  document.getElementById("dateStamp").textContent = d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}
setDate();
showCover();
</script>
